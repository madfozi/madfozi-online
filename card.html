<title>Muhamad Fauzi Ayub | Digital Contact Card</title>
<style>
*{box-sizing:border-box}
:root{--petronas:#006b54;--petronas2:#00a99d;--ink:#12302c;--soft:#eef6f4}
body{margin:0;background:#dfe9e7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:20px}
.card{width:min(560px,100%);background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,.15)}
.art{display:block;width:100%;height:auto}
.content{padding:24px}
h1{font-size:27px;line-height:1.08;margin:0 0 7px}
.title{font-size:16px;font-weight:700;color:var(--petronas);margin-bottom:4px}
.company{font-size:14px;color:#52635f;margin-bottom:22px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;text-decoration:none;font-weight:750;font-size:14px}
.primary{background:var(--petronas);color:#fff}
.secondary{background:var(--soft);color:var(--petronas)}
.details{margin-top:20px;border-top:1px solid #e5ecea;padding-top:7px}
.row{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid #edf1f0;align-items:center}
.icon{width:34px;height:34px;border-radius:10px;background:#e6f3f0;display:grid;place-items:center;font-size:16px;flex:0 0 34px}
.row a{color:var(--ink);text-decoration:none;word-break:break-word}
.qrbox{margin:24px auto 2px;text-align:center}
.qrbox img{width:145px;height:145px;border-radius:12px}
.qrbox p{margin:8px 0 0;font-size:12px;color:#60716d}
.tagline{text-align:center;margin:25px 0 4px;font-size:10px;letter-spacing:2.2px;color:#6c817d}
</style>
</head>
<body>
